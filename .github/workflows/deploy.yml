name: Deploy to Server

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy with Docker Compose
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SSH_HOST || secrets.SERVER_HOST || '159.65.123.140' }}
        username: ${{ secrets.SSH_USERNAME || secrets.SERVER_USERNAME || 'seidme' }}
        key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY || secrets.SERVER_KEY }}
        script: |
            # Navigate to the directory where your project is on the server
            cd /var/www/video-downloader 

            # Pull the latest changes from GitHub
            git pull --ff-only

            # Rebuild and restart the Docker services
            docker compose up --build -d
